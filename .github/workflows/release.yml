name: Publish Kiosoo Video installer

# Runtime components (runtime-manifest.json + *-runtime-*.zip) are built from
# the app repository's scripts/package-*-runtime.ps1 and uploaded to the release
# by the maintainer. This workflow must never delete a release or replace
# runtime assets; it only attaches the installer from payload/.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Select installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          # Only attach an installer whose version matches the pushed tag. The
          # installer is normally uploaded with the release itself; a stale
          # payload must never be attached to a newer release.
          version="${GITHUB_REF_NAME#v}"
          file="payload/Kiosoo-Video_${version}_x64-setup.exe"
          if [ ! -f "$file" ]; then
            echo "No payload installer for ${version}; nothing to attach."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p release-work
          cp "$file" "release-work/000-$(basename "$file")"
          echo "path=release-work/000-$(basename "$file")" >> "$GITHUB_OUTPUT"

      - name: Attach installer without touching runtime assets
        if: steps.installer.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Kiosoo Video $tag" --generate-notes
          fi
          gh release upload "$tag" "${{ steps.installer.outputs.path }}" --clobber
